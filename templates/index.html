<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Form</title>
</head>
<body>
    <h1>Upload Text</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="text-input">Text Input:</label><br>
        <textarea id="text-input" name="text-input" rows="4" cols="50" required></textarea><br><br>

        <label for="output-format">Output Format:</label><br>
        <select id="output-format" name="output-format">
            <option value="audio">Audio</option>
            <option value="ppt">PowerPoint</option>
            <option value="both">Both</option>
        </select><br><br>

        <input type="submit" value="Submit">
    </form>

    <h2>Results:</h2>
    <div id="results">
        <!-- Results will be displayed here -->
    </div>
</body>
</html>
